name: TryAnneal Security Audit

# Run TryAnneal on every PR that changes Solidity. Posts the verdict block
# as a PR comment. Wide-open input — no chain calls, no LLM keys required;
# uses Slither + custom detectors + corpus for reproducible static analysis.

on:
  pull_request:
    paths:
      - "**/*.sol"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: anneal audit (Slither + corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the base-ref diff

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (dist for cross-package consumers)
        run: pnpm --filter @tryanneal/engine build

      - name: Install Slither + solc + TryAnneal detector plugin
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
          pip install -e packages/detectors

      - name: Detect changed Solidity files
        id: changed
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '**/*.sol' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Solidity files changed — exiting cleanly."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # Pass list via a heredoc-safe env file.
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run TryAnneal audit
        if: steps.changed.outputs.files != ''
        env:
          CHAINGPT_API_KEY: ${{ secrets.CHAINGPT_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          HUNYUAN_API_KEY:  ${{ secrets.HUNYUAN_API_KEY }}
        run: |
          mkdir -p /tmp/anneal
          echo "TryAnneal audit (Slither + TryAnneal detectors + corpus)" > /tmp/anneal/results.txt
          echo "Commit: ${{ github.event.pull_request.head.sha }}" >> /tmp/anneal/results.txt
          echo "" >> /tmp/anneal/results.txt
          set +e
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "============================================================" >> /tmp/anneal/results.txt
            echo " ANNEAL: $f" >> /tmp/anneal/results.txt
            echo "============================================================" >> /tmp/anneal/results.txt
            pnpm --filter @tryanneal/cli exec tsx src/index.ts audit "$f" --no-llm --no-encrypt --gas-only=false 2>&1 | tee -a /tmp/anneal/results.txt
            echo "" >> /tmp/anneal/results.txt
          done <<< "${{ steps.changed.outputs.files }}"
          set -e

      - name: Post audit results as PR comment
        if: always() && steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/anneal/results.txt';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '_No Solidity files changed; audit skipped._';
            const trimmed = body.length > 60000 ? body.slice(0, 60000) + '\n…(truncated)' : body;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body:
                '## 🔍 TryAnneal Security Audit\n\n' +
                '```text\n' + trimmed + '\n```\n\n' +
                '*Powered by [TryAnneal](https://tryanneal.xyz) — Mantle-native multi-LLM audit engine.*\n' +
                '*Run locally with `pnpm --filter @tryanneal/cli exec tsx src/index.ts audit <file>`.*',
            });
