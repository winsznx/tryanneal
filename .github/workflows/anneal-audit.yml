name: TryAnneal Security Audit

# Audit every PR that changes Solidity. Posts the verdict as a PR comment and a
# pass/fail check-run that branch protection can block merges on. NO LLM keys —
# deterministic Slither + 16 custom detectors + the 98-pattern corpus. Drop-in:
# uses the published @tryanneal/cli + tryanneal-detectors, so it works in any repo.

on:
  pull_request:
    paths:
      - "**/*.sol"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: anneal audit (Slither + corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the base-ref diff

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither + detectors
        run: |
          # tryanneal-detectors (PyPI) pulls slither-analyzer + registers the 16
          # custom detectors + the 98-pattern corpus matcher. No LLM keys needed.
          pip install tryanneal-detectors solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Detect changed Solidity files
        id: changed
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '**/*.sol' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Solidity files changed — exiting cleanly."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$CHANGED"
          { echo "files<<EOF"; echo "$CHANGED"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Run TryAnneal audit
        id: audit
        if: steps.changed.outputs.files != ''
        # NO API KEYS. --no-llm = deterministic Slither + 16 detectors + corpus.
        # Safe on forked PRs; nothing to configure.
        env:
          ANNEAL_THRESHOLD: ${{ vars.ANNEAL_THRESHOLD || '80' }}
          NO_COLOR: "1"   # plain text in the PR comment (no ANSI escapes)
        run: |
          mkdir -p /tmp/anneal
          echo "TryAnneal audit (Slither + 16 detectors + 98-pattern corpus)" > /tmp/anneal/results.txt
          echo "Commit: ${{ github.event.pull_request.head.sha }}" >> /tmp/anneal/results.txt
          echo "" >> /tmp/anneal/results.txt
          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "============================================================" >> /tmp/anneal/results.txt
            echo " ANNEAL: $f" >> /tmp/anneal/results.txt
            echo "============================================================" >> /tmp/anneal/results.txt
            # Published CLI runs from the repo root, so the relative path resolves.
            # It exits non-zero on high/critical or score < threshold — capture it.
            npx -y @tryanneal/cli audit "$f" --no-llm --no-encrypt --threshold "$ANNEAL_THRESHOLD" 2>&1 | tee -a /tmp/anneal/results.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then FAILED=1; fi
            echo "" >> /tmp/anneal/results.txt
          done <<< "${{ steps.changed.outputs.files }}"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "TryAnneal gate: FAILED=$FAILED (threshold $ANNEAL_THRESHOLD)"

      - name: Post audit results + verdict as PR comment
        if: always() && steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const failed = '${{ steps.audit.outputs.failed }}' === '1';
            const header = failed
              ? '## ❌ TryAnneal — BLOCKED\nA changed contract has high/critical findings or scored below the merge threshold. Fix before merging.'
              : '## ✅ TryAnneal — PASSED\nNo high/critical findings; all changed contracts cleared the merge threshold.';
            const path = '/tmp/anneal/results.txt';
            const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '_audit skipped._';
            // eslint-disable-next-line no-control-regex
            const body = raw.replace(/\x1b\[[0-9;]*m/g, '');   // strip any ANSI color codes
            const trimmed = body.length > 60000 ? body.slice(0, 60000) + '\n…(truncated)' : body;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body:
                header + '\n\n' +
                '```text\n' + trimmed + '\n```\n\n' +
                '*Powered by [TryAnneal](https://tryanneal.xyz) — Mantle-native multi-model audit engine. ' +
                'Deterministic Slither + 16 detectors + 98-pattern corpus; tune with `--threshold`.*',
            });

      - name: Enforce the gate (fail the check so branch protection can block merge)
        if: steps.audit.outputs.failed == '1'
        run: |
          echo "::error::TryAnneal blocked this PR — high/critical findings or score below threshold."
          exit 1
