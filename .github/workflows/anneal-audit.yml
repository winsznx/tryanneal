name: TryAnneal Security Audit

# Run TryAnneal on every PR that changes Solidity. Posts the verdict block
# as a PR comment. Wide-open input — no chain calls, no LLM keys required;
# uses Slither + custom detectors + corpus for reproducible static analysis.

on:
  pull_request:
    paths:
      - "**/*.sol"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: anneal audit (Slither + corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the base-ref diff

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine (dist for cross-package consumers)
        run: pnpm --filter @tryanneal/engine build

      - name: Install Slither + solc + TryAnneal detectors
        run: |
          # tryanneal-detectors (PyPI) pulls slither-analyzer + registers the 16
          # custom detectors + the 98-pattern corpus matcher. No LLM keys needed.
          pip install tryanneal-detectors solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Detect changed Solidity files
        id: changed
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '**/*.sol' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Solidity files changed — exiting cleanly."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          # Pass list via a heredoc-safe env file.
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run TryAnneal audit
        id: audit
        if: steps.changed.outputs.files != ''
        # NO API KEYS REQUIRED. The audit runs --no-llm: deterministic Slither +
        # 16 custom detectors + the 98-pattern corpus. Drop this workflow into any
        # repo and it just works — nothing to configure, safe on forked PRs.
        env:
          # Merge gate: block the PR if any changed contract scores below this.
          ANNEAL_THRESHOLD: ${{ vars.ANNEAL_THRESHOLD || '80' }}
        run: |
          mkdir -p /tmp/anneal
          echo "TryAnneal audit (Slither + 16 TryAnneal detectors + 98-pattern corpus)" > /tmp/anneal/results.txt
          echo "Commit: ${{ github.event.pull_request.head.sha }}" >> /tmp/anneal/results.txt
          echo "" >> /tmp/anneal/results.txt
          FAILED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "============================================================" >> /tmp/anneal/results.txt
            echo " ANNEAL: $f" >> /tmp/anneal/results.txt
            echo "============================================================" >> /tmp/anneal/results.txt
            # The CLI exits non-zero on high/critical or score < threshold.
            # Capture that exit code per file instead of discarding it.
            pnpm --filter @tryanneal/cli exec tsx src/index.ts audit "$f" --no-llm --no-encrypt --threshold "$ANNEAL_THRESHOLD" 2>&1 | tee -a /tmp/anneal/results.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then FAILED=1; fi
            echo "" >> /tmp/anneal/results.txt
          done <<< "${{ steps.changed.outputs.files }}"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "TryAnneal gate: FAILED=$FAILED (threshold $ANNEAL_THRESHOLD)"

      - name: Post audit results + verdict as PR comment
        if: always() && steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const failed = '${{ steps.audit.outputs.failed }}' === '1';
            const header = failed
              ? '## ❌ TryAnneal — BLOCKED\nA changed contract has high/critical findings or scored below the merge threshold. Fix before merging.'
              : '## ✅ TryAnneal — PASSED\nNo high/critical findings; all changed contracts cleared the merge threshold.';
            const path = '/tmp/anneal/results.txt';
            const body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '_audit skipped._';
            const trimmed = body.length > 60000 ? body.slice(0, 60000) + '\n…(truncated)' : body;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body:
                header + '\n\n' +
                '```text\n' + trimmed + '\n```\n\n' +
                '*Powered by [TryAnneal](https://tryanneal.xyz) — Mantle-native multi-model audit engine. ' +
                'Deterministic Slither + 16 detectors + 98-pattern corpus; tune with `--threshold`.*',
            });

      - name: Enforce the gate (fail the check so branch protection can block merge)
        if: steps.audit.outputs.failed == '1'
        run: |
          echo "::error::TryAnneal blocked this PR — high/critical findings or score below threshold."
          exit 1
