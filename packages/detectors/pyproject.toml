[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tryanneal-detectors"
version = "0.1.0"
description = "Mantle-specific and agent-context Slither detectors for TryAnneal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TryAnneal" }]
dependencies = [
  "slither-analyzer>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12"]

[project.entry-points."slither_analyzer.plugin"]
tryanneal = "tryanneal_detectors:make_plugin"

[tool.setuptools.packages.find]
include = ["tryanneal_detectors*"]

[tool.setuptools.package-data]
tryanneal_detectors = ["corpus/patterns.json"]
